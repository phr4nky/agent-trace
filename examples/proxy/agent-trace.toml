# agent-trace proxy configuration for the GitHub MCP server.
# See docs/proxy.md. Use it with an absolute path:
#   agent-trace --config /path/to/agent-trace.toml proxy --name github -- <server command>
#
# Tool names differ between server versions. Check the recorded `tools/list` answer with
#   agent-trace trace show --latest --payload

[policy]
# Tools that write with the user's token. Added to the built-in privileged tools.
privileged = [
    "create_pull_request",
    "create_or_update_file",
    "push_files",
    "create_issue",
    "add_issue_comment",
    "merge_pull_request",
]

[proxy]
# "observe" records only; "enforce" answers denied calls with a tool error; "ask" asks the
# user (MCP elicitation) and forwards only approved calls.
mode = "enforce"
# Results of these tools are written by strangers. A privileged call after one of them is
# denied in enforce mode. Reading your own files does not taint the session.
taint_sources = [
    "get_issue",
    "list_issues",
    "get_issue_comments",
    "search_*",
    "get_pull_request*",
    "list_pull_requests",
]

# A task profile for looking at issues: `--profile read-only` hides and denies every other
# tool, so the session cannot open a pull request at all.
[profiles.read-only]
tools = ["get_*", "list_*", "search_*"]
