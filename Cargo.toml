[workspace]
resolver = "3"
members = [
    "crates/agent-trace-core",
    "crates/agent-trace-storage",
    "crates/agent-trace-mcp",
    "crates/agent-trace-llm",
    "crates/agent-trace-net",
    "crates/agent-trace-cli",
]

[workspace.package]
version = "1.5.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/phr4nky/agent-trace"
authors = ["Frank Kuhn"]
description = "Local-first security trace recorder and forensic explorer for AI agents and MCP tool use."

[workspace.dependencies]
agent-trace-core = { path = "crates/agent-trace-core" }
agent-trace-storage = { path = "crates/agent-trace-storage" }
agent-trace-mcp = { path = "crates/agent-trace-mcp" }
agent-trace-llm = { path = "crates/agent-trace-llm" }
agent-trace-net = { path = "crates/agent-trace-net" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ratatui = "0.30.2"
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
postgres = "0.19.14"
regex = "1.13.1"
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rmcp = { version = "3.10.0", default-features = false, features = ["server", "client", "macros", "schemars", "transport-io", "transport-child-process", "elicitation"] }
libc = "0.2.191"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["ring", "webpki-roots"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "v5", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
