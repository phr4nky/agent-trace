[package]
name = "agent-trace-net"
description = "Network transports for agent-trace: MCP over streamable HTTP as the proxy's upstream."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
agent-trace-core.workspace = true
agent-trace-mcp.workspace = true
